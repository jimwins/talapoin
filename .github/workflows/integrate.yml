name: "Integrate"

on: [push]

jobs:
  phpstan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: php-actions/composer@v6

      - name: PHPStan Static Analysis
        uses: php-actions/phpstan@v3

  coding-standards:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: php-actions/composer@v6

      - name: Coding Standard Check
        uses: php-actions/phpcs@v1
